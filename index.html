
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Reporte de fugas</title>

  <style>
    body {
        background-color: rgb(135, 206, 235);
    }

    input, textarea {
        display: block;
    }
body > p {
    font-size: 40px;
}
</style>
</head>

<body>
   <h1>Sistema de registro de fugas de agua</h1>
<img src="pinguino viendo.png" alt="Pingüino con su celular" width="500"
     style="float: left; margin-right: 15px;">

<p>Ayúdanos a identificar y reportar las fugas de agua dentro de nuestro plantel.</p>
<p>El cuidado del agua es responsabilidad de todos.</p>


<h2 style="clear: both;">Reportar una fuga</h2>
<img src="pinguino.png" alt="Celular para reportar una fuga" width="500">

    <form>
        <p><label> <h1 style="text-align: center;">Tu nombre:</h1> <input type="text-align
            center" required></label></p>

        <p><label><h1>Ubicación de la fuga:</h1> <input type="text" required></label></p>

        <p><label><h1>¿Qué está pasando?</h1> <textarea required></textarea></label></p>

        <p><label><h1>Fecha:</h1> <input type="date" required></label></p>

        <button type="submit"><h1>Enviar reporte</h1></button>
    </form>
</body>
</html>
